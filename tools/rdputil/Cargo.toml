[package]
name = "rdputil"
version = "0.1.0"
edition = "2021"
description = "Standalone RDP test client driving IronRDP (path deps into the patched upstream tree)"

# Two source modes:
#   default   — official upstream master plus the redirected-volume-root open
#               fix (experiments/IronRDP-upstream-rdpdrroot; the pristine
#               upstream checkout lives in experiments/IronRDP-upstream)
#   fork mode — fork tree: swap "IronRDP-upstream-rdpdrroot" for "IronRDP-src"
#               in the paths below and add --features fork (enables the
#               legacy-client switches RDPUTIL_LEGACY_INPUT /
#               RDPUTIL_LEGACY_CLIENT, which rely on fork-only APIs).
[features]
fork = []

[dependencies]
ironrdp = { path = "../../experiments/IronRDP-upstream-rdpdrroot/crates/ironrdp", features = [
    "cliprdr", "connector", "session", "graphics", "input", "svc", "dvc", "displaycontrol", "rdpdr",
] }
ironrdp-pdu = { path = "../../experiments/IronRDP-upstream-rdpdrroot/crates/ironrdp-pdu" }
ironrdp-blocking = { path = "../../experiments/IronRDP-upstream-rdpdrroot/crates/ironrdp-blocking" }
ironrdp-graphics = { path = "../../experiments/IronRDP-upstream-rdpdrroot/crates/ironrdp-graphics" }
ironrdp-rdpdr = { path = "../../experiments/IronRDP-upstream-rdpdrroot/crates/ironrdp-rdpdr" }
ironrdp-rdpdr-native = { path = "../../experiments/IronRDP-upstream-rdpdrroot/crates/ironrdp-rdpdr-native" }
ironrdp-rdpsnd = { path = "../../experiments/IronRDP-upstream-rdpdrroot/crates/ironrdp-rdpsnd" }
ironrdp-rail = { path = "../../experiments/IronRDP-upstream-rdpdrroot/crates/ironrdp-rail" }
pico-args = "0.5"
serde_json = "1"
base64 = "0.22"
x509-cert = { version = "0.3", default-features = false, features = ["std"] }
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
sspi = { version = "0.21", features = ["network_client"] }
tokio-rustls = "0.26"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
debug = false

[package]
name = "rdputil"
version = "0.1.0"
edition = "2021"
description = "Standalone RDP test client driving IronRDP"

# IronRDP is consumed from a git source because two pieces this client needs
# are not on crates.io yet: the Windows drive-redirection backend
# (ironrdp-rdpdr-native ships only the nix backend in the published releases)
# and the RAIL client (ironrdp-rail is unpublished). The branch below is
# upstream master plus two small drive-redirection fixes, both prepared as
# upstream contributions:
#
#   1. rdpdr-native: the volume-root open must let the drive-letter symbolic
#      link resolve (OBJ_DONT_REPARSE fails every \??\X:\ open with
#      STATUS_REPARSE_POINT_ENCOUNTERED, so the guest disables the device).
#   2. rdpdr: drive DeviceData must be null-terminated ASCII; the Windows
#      redirector reads it as ASCII regardless of the capability version, so
#      UTF-16 data truncates the share name to its first character.
#
# Once the fixes land upstream, these dependencies can point at the official
# repository directly.
[dependencies]
ironrdp = { git = "https://github.com/YaoSiQian/IronRDP", branch = "fix/windows-drive-redirection", features = [
    "cliprdr", "connector", "session", "graphics", "input", "svc", "dvc", "displaycontrol", "rdpdr",
] }
ironrdp-pdu = { git = "https://github.com/YaoSiQian/IronRDP", branch = "fix/windows-drive-redirection" }
ironrdp-blocking = { git = "https://github.com/YaoSiQian/IronRDP", branch = "fix/windows-drive-redirection" }
ironrdp-graphics = { git = "https://github.com/YaoSiQian/IronRDP", branch = "fix/windows-drive-redirection" }
ironrdp-rdpdr = { git = "https://github.com/YaoSiQian/IronRDP", branch = "fix/windows-drive-redirection" }
ironrdp-rdpdr-native = { git = "https://github.com/YaoSiQian/IronRDP", branch = "fix/windows-drive-redirection" }
ironrdp-rdpsnd = { git = "https://github.com/YaoSiQian/IronRDP", branch = "fix/windows-drive-redirection" }
ironrdp-rail = { git = "https://github.com/YaoSiQian/IronRDP", branch = "fix/windows-drive-redirection" }
pico-args = "0.5"
serde_json = "1"
base64 = "0.22"
x509-cert = { version = "0.3", default-features = false, features = ["std"] }
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
sspi = { version = "0.21", features = ["network_client"] }
tokio-rustls = "0.26"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
debug = false

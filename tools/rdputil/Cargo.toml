[package]
name = "rdputil"
version = "0.1.0"
edition = "2021"
description = "Standalone RDP test client driving IronRDP (path deps into experiments/IronRDP-src)"

[dependencies]
ironrdp = { path = "../../experiments/IronRDP-src/crates/ironrdp", features = [
    "cliprdr", "connector", "session", "graphics", "input", "svc", "dvc", "displaycontrol", "rdpdr",
] }
ironrdp-pdu = { path = "../../experiments/IronRDP-src/crates/ironrdp-pdu" }
ironrdp-blocking = { path = "../../experiments/IronRDP-src/crates/ironrdp-blocking" }
ironrdp-graphics = { path = "../../experiments/IronRDP-src/crates/ironrdp-graphics" }
ironrdp-rdpdr = { path = "../../experiments/IronRDP-src/crates/ironrdp-rdpdr" }
ironrdp-rdpdr-native = { path = "../../experiments/IronRDP-src/crates/ironrdp-rdpdr-native" }
ironrdp-rdpsnd = { path = "../../experiments/IronRDP-src/crates/ironrdp-rdpsnd" }
pico-args = "0.5"
serde_json = "1"
base64 = "0.22"
x509-cert = { version = "0.3", default-features = false, features = ["std"] }
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
sspi = { version = "0.21", features = ["network_client"] }
tokio-rustls = "0.26"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
debug = false
